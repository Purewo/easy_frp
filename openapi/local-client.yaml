openapi: 3.1.0
info:
  title: frp Local Client API
  version: 0.1.0
  description: Local backend API for managing frps nodes and exposing TCP/UDP ports and HTTP web services through frpc.
servers:
  - url: http://127.0.0.1:7410
    description: Local client backend
tags:
  - name: client-direct
    description: Direct frpc node and port exposure flow for the frontend
  - name: client-rooms
    description: Local XTCP/STCP room rules, process status, and NAT diagnostics
paths:
  /v1/nodes:
    get:
      operationId: listLocalNodes
      tags: [client-direct]
      responses:
        '200':
          description: Local frps nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeView'
    post:
      operationId: createLocalNode
      tags: [client-direct]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: Local frps node created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeView'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/nodes/{nodeId}:
    put:
      operationId: updateLocalNode
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/nodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: Local frps node updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLocalNode
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/nodeId'
      responses:
        '204':
          description: Local frps node deleted
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/nodes/{nodeId}/doctor:
    post:
      operationId: doctorLocalNode
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/nodeId'
      responses:
        '200':
          description: Local frps node diagnostic result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDoctorResult'
        '404':
          $ref: '#/components/responses/Error'
  /v1/ports:
    get:
      operationId: listPortRules
      tags: [client-direct]
      responses:
        '200':
          description: TCP/UDP and HTTP web exposure rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortRule'
    post:
      operationId: createPortRule
      tags: [client-direct]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortRuleRequest'
      responses:
        '201':
          description: Port rule created and applied to frpc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortRule'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/ports/{portId}:
    put:
      operationId: updatePortRule
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/portId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePortRuleRequest'
      responses:
        '200':
          description: Port rule updated and applied to frpc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortRule'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchPortRule
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/portId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPortRuleRequest'
      responses:
        '200':
          description: Port rule state updated and applied to frpc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortRule'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePortRule
      tags: [client-direct]
      parameters:
        - $ref: '#/components/parameters/portId'
      responses:
        '204':
          description: Port rule deleted and applied to frpc
        '404':
          $ref: '#/components/responses/Error'
  /v1/client/rooms:
    get:
      operationId: listLocalRoomRules
      tags: [client-rooms]
      responses:
        '200':
          description: Local room rules stored by this client backend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomRuleView'
  /v1/client/rooms/status:
    get:
      operationId: listLocalRoomStatuses
      tags: [client-rooms]
      responses:
        '200':
          description: Local room rules with their frpc process state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomRuleStatus'
  /v1/client/rooms/host:
    post:
      operationId: createLocalRoomHost
      tags: [client-rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomHostRequest'
      responses:
        '201':
          description: Host room created locally and applied to frpc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRuleView'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/client/rooms/join:
    post:
      operationId: joinLocalRoom
      tags: [client-rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
      responses:
        '201':
          description: Visitor room rule created locally and applied to frpc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRuleView'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/client/rooms/{roomRuleId}:
    patch:
      operationId: patchLocalRoomRule
      tags: [client-rooms]
      parameters:
        - $ref: '#/components/parameters/roomRuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRoomRuleRequest'
      responses:
        '200':
          description: Local room rule state updated and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRuleView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLocalRoomRule
      tags: [client-rooms]
      parameters:
        - $ref: '#/components/parameters/roomRuleId'
      responses:
        '204':
          description: Local room rule deleted and frpc reapplied
        '404':
          $ref: '#/components/responses/Error'
  /v1/client/rooms/{roomRuleId}/doctor:
    post:
      operationId: doctorLocalRoomRule
      tags: [client-rooms]
      parameters:
        - $ref: '#/components/parameters/roomRuleId'
      responses:
        '200':
          description: Local room diagnostic result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDoctorResult'
        '404':
          $ref: '#/components/responses/Error'
  /v1/client/network/interfaces:
    get:
      operationId: listClientNetworkInterfaces
      tags: [client-rooms]
      responses:
        '200':
          description: Local IPv4 interfaces for NAT diagnostics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterfaceView'
  /v1/client/xtcp/nathole/discover:
    post:
      operationId: discoverClientNatHole
      tags: [client-rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatHoleDiscoverRequest'
      responses:
        '200':
          description: frpc nathole discover output. Command-level failures are returned as success=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatHoleDiscoverResult'
        '400':
          $ref: '#/components/responses/Error'
  /v1/frpc/status:
    get:
      operationId: directFrpcStatus
      tags: [client-direct]
      responses:
        '200':
          description: frpc status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrpcStatus'
  /v1/frpc/reload:
    post:
      operationId: directFrpcReload
      tags: [client-direct]
      responses:
        '200':
          description: frpc reload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrpcStatus'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/logs:
    get:
      operationId: directLogs
      tags: [client-direct]
      responses:
        '200':
          description: Recent frpc logs
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    portId:
      name: portId
      in: path
      required: true
      schema:
        type: string
    nodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    roomRuleId:
      name: roomRuleId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    PortRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: integer
        to:
          type: integer
    NodeView:
      type: object
      required: [id, name, serverAddr, frpsPort, authMethod, authTokenSet]
      properties:
        id:
          type: string
          example: default
        name:
          type: string
          example: Default frps
        serverAddr:
          type: string
          example: 149.118.158.112
        frpsPort:
          type: integer
          example: 7000
        authMethod:
          type: string
          enum: [token]
        authTokenSet:
          type: boolean
        webBaseDomain:
          type: string
          example: ma1.gameuniverse.top
        webScheme:
          type: string
          example: https
        vhostHTTPPort:
          type: integer
          example: 8080
        allowPorts:
          type: array
          items:
            $ref: '#/components/schemas/PortRange'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateNodeRequest:
      type: object
      required: [serverAddr]
      properties:
        id:
          type: string
          description: Optional stable node id. If omitted, the backend derives one from name or generates one.
          example: backup
        name:
          type: string
          example: Backup frps
        serverAddr:
          type: string
          description: frps host or IP without scheme, path, or port.
          example: 149.118.158.112
        frpsPort:
          type: integer
          default: 7000
          minimum: 1
          maximum: 65535
        authMethod:
          type: string
          enum: [token]
          default: token
        authToken:
          type: string
          description: Stored locally and never returned by API responses.
        webBaseDomain:
          type: string
          description: Optional wildcard HTTPS base domain for http rules, for example ma1.gameuniverse.top.
          example: ma1.gameuniverse.top
        webScheme:
          type: string
          enum: [http, https]
          default: https
        vhostHTTPPort:
          type: integer
          default: 8080
          minimum: 1
          maximum: 65535
        allowPorts:
          type: array
          description: Optional allow-list for TCP/UDP remote ports on this node.
          items:
            $ref: '#/components/schemas/PortRange'
    UpdateNodeRequest:
      type: object
      required: [name, serverAddr, frpsPort, authMethod, webScheme]
      properties:
        name:
          type: string
        serverAddr:
          type: string
        frpsPort:
          type: integer
          minimum: 1
          maximum: 65535
        authMethod:
          type: string
          enum: [token]
        authToken:
          type: string
          description: Optional replacement token. Omit to keep the existing token.
        clearAuthToken:
          type: boolean
          default: false
          description: Set true to remove the stored token.
        webBaseDomain:
          type: string
        webScheme:
          type: string
          enum: [http, https]
        vhostHTTPPort:
          type: integer
          minimum: 1
          maximum: 65535
        allowPorts:
          type: array
          items:
            $ref: '#/components/schemas/PortRange'
    NodeDoctorResult:
      type: object
      required: [node, overall, checks]
      properties:
        node:
          $ref: '#/components/schemas/NodeView'
        overall:
          type: string
          enum: [pass, warn, fail]
        testedDomain:
          type: string
          example: doctor-ab12cd34.ma1.gameuniverse.top
        checks:
          type: array
          items:
            $ref: '#/components/schemas/NodeDoctorCheck'
    NodeDoctorCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
          example: frpc-login
        name:
          type: string
          example: frpc 登录验证
        status:
          type: string
          enum: [pass, warn, fail, skipped]
        message:
          type: string
        durationMs:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties:
            type: string
    PortRule:
      type: object
      required: [id, nodeId, name, protocol, localIP, localPort, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: port_0123abcd4567ef89
        nodeId:
          type: string
          example: default
        name:
          type: string
          example: web
        protocol:
          type: string
          enum: [tcp, udp, http]
        localIP:
          type: string
          example: 127.0.0.1
        localPort:
          type: integer
          minimum: 1
          maximum: 65535
          example: 8080
        remotePort:
          type: integer
          minimum: 1024
          maximum: 65535
          example: 18080
        subdomain:
          type: string
          example: blog
        domain:
          type: string
          example: blog.ma1.gameuniverse.top
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePortRuleRequest:
      type: object
      required: [protocol, localPort]
      properties:
        nodeId:
          type: string
          default: default
        name:
          type: string
        protocol:
          type: string
          enum: [tcp, udp, http]
        localIP:
          type: string
          default: 127.0.0.1
        localPort:
          type: integer
          minimum: 1
          maximum: 65535
        remotePort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Required for tcp and udp rules. Ignored for http rules.
        subdomain:
          type: string
          description: HTTP subdomain under the node webBaseDomain, for example "blog".
        domain:
          type: string
          description: Full HTTP domain under the node webBaseDomain.
        enabled:
          type: boolean
          default: true
    UpdatePortRuleRequest:
      type: object
      required: [protocol, localPort, enabled]
      properties:
        nodeId:
          type: string
          default: default
        name:
          type: string
        protocol:
          type: string
          enum: [tcp, udp, http]
        localIP:
          type: string
          default: 127.0.0.1
        localPort:
          type: integer
          minimum: 1
          maximum: 65535
        remotePort:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Required for tcp and udp rules. Ignored for http rules.
        subdomain:
          type: string
        domain:
          type: string
        enabled:
          type: boolean
    PatchPortRuleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    RoomRuleView:
      type: object
      required: [id, roomId, name, role, tunnelProtocol, serverName, serverAddr, serverPort, deviceId, deviceTokenSet, secretKeySet, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        roomCode:
          type: string
          description: Present only in the create-host response. Treat as secret.
        name:
          type: string
        role:
          type: string
          enum: [host, visitor]
        tunnelProtocol:
          type: string
          enum: [xtcp, stcp]
          default: xtcp
        natHoleStunServer:
          type: string
          description: Optional STUN server for XTCP, for example stun.easyvoip.com:3478.
        serverName:
          type: string
        serverAddr:
          type: string
        serverPort:
          type: integer
        deviceId:
          type: string
        deviceTokenSet:
          type: boolean
        secretKeySet:
          type: boolean
        localIP:
          type: string
        localPort:
          type: integer
        bindAddr:
          type: string
        bindPort:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateRoomHostRequest:
      type: object
      required: [name, localPort]
      properties:
        name:
          type: string
        deviceName:
          type: string
        serverBaseURL:
          type: string
          description: Optional override for private control-server deployments. Omit it in the normal frontend flow so the local backend uses the built-in remote control server.
        tunnelProtocol:
          type: string
          enum: [xtcp, stcp]
          default: xtcp
        natHoleStunServer:
          type: string
        localIP:
          type: string
          default: 127.0.0.1
        localPort:
          type: integer
          minimum: 1
          maximum: 65535
        enabled:
          type: boolean
          default: true
    JoinRoomRequest:
      type: object
      required: [roomCode, bindPort]
      properties:
        roomCode:
          type: string
        name:
          type: string
        deviceName:
          type: string
        serverBaseURL:
          type: string
          description: Optional override for private control-server deployments. Omit it in the normal frontend flow so the local backend uses the built-in remote control server.
        tunnelProtocol:
          type: string
          enum: [xtcp, stcp]
          default: xtcp
        natHoleStunServer:
          type: string
        bindAddr:
          type: string
          default: 127.0.0.1
        bindPort:
          type: integer
          minimum: 1
          maximum: 65535
        enabled:
          type: boolean
          default: true
    PatchRoomRuleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    RoomRuleStatus:
      type: object
      required: [rule, process]
      properties:
        rule:
          $ref: '#/components/schemas/RoomRuleView'
        process:
          $ref: '#/components/schemas/FrpcNodeStatus'
    RoomDoctorResult:
      type: object
      required: [rule, overall, checks]
      properties:
        rule:
          $ref: '#/components/schemas/RoomRuleView'
        overall:
          type: string
          enum: [pass, warn, fail]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/NodeDoctorCheck'
    NatHoleDiscoverRequest:
      type: object
      properties:
        stunServer:
          type: string
          description: Optional STUN server, for example stun.easyvoip.com:3478.
        localAddr:
          type: string
          description: Optional local UDP bind address for diagnostics only, for example 10.7.24.208:0.
    NatHoleDiscoverResult:
      type: object
      required: [success, rawOutput]
      properties:
        success:
          type: boolean
        stunServer:
          type: string
        natType:
          type: string
        behavior:
          type: string
        externalAddresses:
          type: array
          items:
            type: string
        localAddress:
          type: string
        publicNetwork:
          type: boolean
        rawOutput:
          type: string
        error:
          type: string
        durationMs:
          type: integer
          format: int64
    NetworkInterfaceView:
      type: object
      required: [name, index, address, loopback, multicast]
      properties:
        name:
          type: string
        index:
          type: integer
        address:
          type: string
        loopback:
          type: boolean
        multicast:
          type: boolean
    FrpcStatus:
      type: object
      required: [running, configPath]
      properties:
        running:
          type: boolean
          description: True when at least one frpc process is running.
        pid:
          type: integer
          description: Present for single-process status responses. Multi-node mode uses nodes[].pid.
        configPath:
          type: string
          description: Primary config path, kept for backward compatibility.
        lastError:
          type: string
        nodes:
          type: array
          description: Per-node frpc process states in direct multi-node mode.
          items:
            $ref: '#/components/schemas/FrpcNodeStatus'
    FrpcNodeStatus:
      type: object
      required: [nodeId, running, configPath]
      properties:
        nodeId:
          type: string
          example: default
        running:
          type: boolean
        pid:
          type: integer
        configPath:
          type: string
          example: .\data\frpc\frpc.toml
        logPath:
          type: string
          example: .\data\frpc\frpc.log
        lastError:
          type: string
        roomRuleId:
          type: string
        roomId:
          type: string
        roomName:
          type: string
        roomRole:
          type: string
          enum: [host, visitor]
        tunnelProtocol:
          type: string
          enum: [xtcp, stcp]
        localEndpoint:
          type: string
